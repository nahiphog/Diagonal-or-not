<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, Helvetica, sans-serif; }
.generate-button { border: 0; border-radius: 0.5rem; padding: 0.85rem 1.25rem; background: #111827; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }
.puzzle-actions { display: flex; flex-direction: column; align-items: center; gap: 0.65rem; margin: 1rem 0; }
.puzzle-actions-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.65rem; }
.puzzle-actions .generate-button { margin-top: 0; }
.puzzle-actions-divider { width: 100%; border: none; border-top: 1px solid #d1d5db; margin: 0.25rem 0; }
.simulation-link { background: #2563eb; }
.build-button { background: #166534; }
.halt-button { border: 1px solid #b91c1c; border-radius: 0.5rem; padding: 0.85rem 1.1rem; background: #fff; color: #b91c1c; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<h2>HOW IT RENDERS:</h2>

<div class="puzzle-actions">
  <div class="puzzle-actions-tabs">
    <button class="generate-button simulation-link">Generate</button>
    <button class="generate-button simulation-link">Custom build</button>
    <button class="generate-button simulation-link">Simulation</button>
    <button class="generate-button simulation-link">Import a grid</button>
  </div>
  <hr class="puzzle-actions-divider" />
  <button class="generate-button">Generate a grid</button>
</div>

<p>────────── 4 tabs in one row above the divider ──────────</p>

</body>
</html>
